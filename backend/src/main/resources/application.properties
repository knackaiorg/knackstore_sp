# Server
server.port=8080
server.error.include-message=always

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:electronicsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=knack-electronics-store-jwt-secret-key-2024-hackathon-very-long-secret
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:4200

# Loyalty / Rewards Points
# Per discovery session (Task 03, 2026-07-20): earn 1 point per $1 spent, credited
# immediately and finally at order placement (no delivery gating, no reversal on
# cancellation). Redeem 1 point = $1 off at checkout, optional, minimum 10 points,
# capped at both the order subtotal and the customer's available balance.
app.loyalty.earn-rate-divisor=1
app.loyalty.redeem-points-per-rupee=1
app.loyalty.min-redeem-points=10

# Logging
logging.level.com.knack=INFO

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
