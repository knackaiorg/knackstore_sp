# ===================================================================
# SAP BTP Cloud Foundry profile
# Activated by SPRING_PROFILES_ACTIVE=cloud (set in manifest.yml).
# Only the deltas from application.properties belong here.
# ===================================================================

# Cloud Foundry assigns the port at runtime and injects it as $PORT.
server.port=${PORT:8080}

# Behind the CF router, so trust X-Forwarded-* to keep generated links on https.
server.forward-headers-strategy=framework

# Don't leak stack-trace detail to the browser in a deployed environment.
server.error.include-message=never

# ---- Security ----------------------------------------------------
# The H2 console is an unauthenticated SQL shell over the whole schema.
# It must never be reachable on a public route.
spring.h2.console.enabled=false

# No default on purpose: the app fails fast rather than signing tokens with the
# well-known secret from application.properties. Set it before the first start:
#   cf set-env knackstore JWT_SECRET "$(openssl rand -base64 48)"
app.jwt.secret=${JWT_SECRET}

# The Angular bundle is served by this very app, so /api calls are same-origin
# and no preflight is issued. CorsConfig still requires the property to resolve.
app.cors.allowed-origins=${APP_PUBLIC_URL:https://localhost}

# Swagger UI documents every endpoint publicly. Handy for a demo; flip to false
# (cf set-env knackstore SWAGGER_ENABLED false) for anything longer-lived.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

logging.level.com.knack=INFO
